# 認證相關 API 路徑
login:
  post:
    tags: [認證]
    summary: '用戶登入'
    description: '使用電子郵件和密碼進行用戶登入'
    requestBody:
      required: true
      content:
        使用 nonce 登入:
          schema:
            allOf:
              - $ref: '../swagger.yml#/components/schemas/LoginRequest'
              - type: object
                properties:
                  nonce:
                    type: string
                    example: '1234567890'
                    nullable: true
        不使用 nonce 登入:
          schema:
            $ref: '../swagger.yml#/components/schemas/LoginRequest'

    responses:
      '200':
        description: '登入成功'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/LoginResponse'
      '400':
        description: '請求格式錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/400ErrorResponse'
      '401':
        description: '無法找到用戶資料'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/401ErrorResponse'
      '403':
        description: '密碼錯誤，無法通過身分驗證'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/403ErrorResponse'
      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'

logout:
  post:
    tags: [認證]
    summary: '用戶登出'
    description: '登出當前用戶'
    parameters:
      - $ref: '../swagger.yml#/components/parameters/ContentTypeHeader'
      - $ref: '../swagger.yml#/components/parameters/AuthorizationHeader'
    responses:
      '200':
        description: '登出成功'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/SuccessResponse'
      '401':
        description: '未授權'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/401ErrorResponse'
      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'

refresh:
  post:
    tags: [認證]
    summary: '替換更新 access token'
    description: '使用 refresh token 重新替換更新 access token'
    responses:
      '200':
        description: 'access token 更新成功'
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../swagger.yml#/components/schemas/RefreshTokenResponse'
      '401':
        description: 'Refresh token 無效或過期'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/401ErrorResponse'
      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'

register:
  post:
    tags: [認證]
    summary: '註冊用戶'
    description: '註冊新用戶'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../swagger.yml#/components/schemas/RegisterRequest'
    responses:
      '200':
        description: '註冊成功'
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../swagger.yml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    message:
                      type: string
                      example: '註冊成功'
      '400':
        description: '註冊失敗，格式錯誤或電郵地址已存在'
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: 'invalid params'
                success:
                  type: boolean
                  example: false
                  description: '顯示成功或失敗, 用來作流程判斷'
                  enum:
                    - true
                    - false
                data:
                  type: object
                  properties: {}
            examples:
              invalidUsername:
                summary: '用戶名稱格式錯誤'
                value:
                  message: 'Invalid username format'
                  success: false
                  data: {}
              invalidPassword:
                summary: '密碼格式錯誤'
                value:
                  message: 'Invalid password format'
                  success: false
                  data: {}
              emailExists:
                summary: '電郵地址已存在'
                value:
                  message: 'Email already exists'
                  success: false
                  data: {}

      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'

me:
  get:
    tags: [認證]
    summary: '獲取當前用戶資訊'
    description: '獲取當前登入用戶的詳細資訊'
    parameters:
      - $ref: '../swagger.yml#/components/parameters/ContentTypeHeader'
      - $ref: '../swagger.yml#/components/parameters/AuthorizationHeader'
    responses:
      '200':
        description: '成功獲取用戶資訊'
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '../swagger.yml#/components/schemas/User'
      '401':
        description: '未授權'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/401ErrorResponse'
      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'
