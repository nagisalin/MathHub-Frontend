users:
  get:
    tags: [用戶]
    summary: '獲取用戶列表'
    description: '獲取當前分頁所有用戶列表'
    parameters:
      - $ref: '../swagger.yml#/components/parameters/ContentTypeHeader'
      - $ref: '../swagger.yml#/components/parameters/AuthorizationHeader'
      - $ref: '../swagger.yml#/components/parameters/LimitParam'
      - $ref: '../swagger.yml#/components/parameters/SkipParam'
      - $ref: '../swagger.yml#/components/parameters/FilterParam'
      - $ref: '../swagger.yml#/components/parameters/SortParam'
      - $ref: '../swagger.yml#/components/parameters/ProjectionParam'
    responses:
      '200':
        description: '成功獲取用戶列表'
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../swagger.yml#/components/schemas/PaginationResponse'
                - type: object
                  properties:
                    message:
                      type: string
                      example: '成功獲取用戶列表'
                    data:
                      type: array
                      items:
                        $ref: '../swagger.yml#/components/schemas/User'
      '400':
        description: '請求格式錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/400ErrorResponse'
      '401':
        description: '未授權'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/401ErrorResponse'
      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'

  post:
    tags: [用戶]
    summary: '新增單一用戶'
    description: '新增單一用戶'
    parameters:
      - $ref: '../swagger.yml#/components/parameters/ContentTypeHeader'
      - $ref: '../swagger.yml#/components/parameters/AuthorizationHeader'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../swagger.yml#/components/schemas/UserRequest'

    responses:
      '200':
        description: '成功新增一個用戶'
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../swagger.yml#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    message:
                      type: string
                      example: '成功新增一個用戶'
                    data:
                      $ref: '../swagger.yml#/components/schemas/User'
      '400':
        description: '請求格式錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/400ErrorResponse'
      '401':
        description: '未授權'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/401ErrorResponse'
      '500':
        description: '伺服器錯誤'
        content:
          application/json:
            schema:
              $ref: '../swagger.yml#/components/schemas/500ErrorResponse'

