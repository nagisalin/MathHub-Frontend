# 認證相關 Schema
LoginRequest:
  type: object
  required: [email, password, deviceID]
  properties:
    email:
      allOf:
        - $ref: './user.yml#/Email'
        - description: '用戶電郵地址'
    password:
      allOf:
        - $ref: './user.yml#/Password'
        - description: '用戶密碼'
    deviceID:
      type: string
      example: '4fcd0ed2-0000-0000-0000-283b3841e6ea'
      description: '用戶設備ID'

LoginResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    data:
      allOf:
        - $ref: '../swagger.yml#/components/schemas/RefreshTokenResponse'
        - type: object
          properties:
            user:
              $ref: '../swagger.yml#/components/schemas/User'

RegisterRequest:
  type: object
  required: [email, password, username]
  properties:
    email:
      $ref: './user.yml#/Email'
    password:
      $ref: './user.yml#/Password'
    username:
      $ref: './user.yml#/UserName'

RefreshTokenResponse:
  type: object
  properties:
    accessToken:
      type: string
      example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
    idToken:
      type: string
      example: 'bffabc20-828f-11f0-950dc510-c3f3-4cb'
    expiresIn:
      type: integer
      description: 'access token 有效期間，單位為 ms'
      example: 3600000
